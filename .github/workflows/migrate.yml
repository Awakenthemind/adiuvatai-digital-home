name: Run Database Migrations

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Supabase migrations via REST API
        env:
          SUPABASE_URL: https://uilbnbgvgmepmhkdjdwo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          
          echo "=== Combining all migration files ==="
          cd supabase/migrations
          # Skip .gitkeep, combine all .sql files in order
          cat $(ls *.sql 2>/dev/null | grep -v '.gitkeep' | sort) > /tmp/all_migrations.sql
          echo "Combined $(wc -l < /tmp/all_migrations.sql) lines of SQL"

          echo "=== Installing jq ==="
          sudo apt-get update -qq && sudo apt-get install -y jq -qq

          echo "=== Checking Supabase connection ==="
          curl -s "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            | jq -r '.message // "connected"'

          echo "=== Processing each migration via management API ==="
          # Use Supabase management API to run SQL
          # Format: split by statements, send as transactions
          
          echo "Note: Direct SQL execution via management API requires Supabase CLI or pg connection."
          echo "Fallback: Tables will be created via SQL Editor commands."
          echo "Checking if tables exist..."

          for table in visitors content_objects offers leads analytics_events entities entity_relationships personalization_rules email_sequences email_sends email_events conversations messages media agent_logs content_calendar brand_facts brand_wiki_pages brand_palette brand_typography brand_voice_rules brand_content_pillars brand_archetype brand_wiki_update_log brand_agent_roster brand_competitive brand_offers; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/$table?select=id&limit=1" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
            if [ "$STATUS" = "200" ]; then
              echo "  ✅ $table exists"
            else
              echo "  ⬜ $table missing (status: $STATUS)"
            fi
          done

          echo ""
          echo "=== Summary ==="
          echo "Some tables may not exist yet. For full setup:"
          echo "1. Go to https://supabase.com/dashboard/project/uilbnbgvgmepmhkdjdwo/sql/new"
          echo "2. Paste the contents of supabase/migrations/001_visitors.sql through 012_brand_wiki.sql"
          echo "3. Click Run"
          echo ""
          echo "OR: Add SUPABASE_SERVICE_ROLE_KEY as a secret and I can run migrations automatically."